# Local Postgres for the NQR backend.
#   docker compose up -d
# Connection string (see .env): postgresql://nqr:nqr@localhost:5432/nqr
services:
  db:
    image: postgres:16-alpine
    container_name: nqr-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nqr
      POSTGRES_PASSWORD: nqr
      POSTGRES_DB: nqr
    ports:
      - "5432:5432"
    volumes:
      - nqr-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nqr -d nqr"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nqr-db-data:
